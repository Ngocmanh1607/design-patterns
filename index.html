}, 1000);`},{t:"Đăng ký (subscribe)",p:["Cửa hàng trở thành <b>Publisher</b> và giữ danh sách <code>subscribers</code>.","Ai quan tâm thì gọi <code>subscribe()</code> một lần duy nhất, rồi thôi không hỏi nữa."],n:[{i:"c1",l:"Customer A",x:150,y:100},{i:"c2",l:"Customer B",x:150,y:220},{i:"c3",l:"Customer C",x:150,y:340},{i:"st",l:"Store",s:"subscribers[ ]",x:630,y:220,k:"accent"}],e:[{f:"c1",t:"st",l:"subscribe()",flow:1,seq:0,dash:1,k:"blue"},{f:"c2",t:"st",l:"subscribe()",flow:1,seq:1,dash:1,k:"blue"},{f:"c3",t:"st",l:"subscribe()",flow:1,seq:2,dash:1,k:"blue"}],code:`class Store {

  restock() { this.notify("iphone-arrived"); }

[3, 1, 2].sort((a, b) => b - a);  // strategy so sánh`}]},{id:"command",g:"Behavioral",t:"Command",tag:"Biến một yêu cầu thành một đối tượng độc lập, để có thể xếp hàng, ghi lại hoặc hoàn tác.",when:["Undo/redo, macro, hàng đợi tác vụ","Nhiều nơi kích hoạt cùng một hành động"],avoid:["Hành động đơn giản, không cần lưu lịch sử"],steps:[{t:"Vấn đề: logic rải rác",p:["Trình soạn thảo có nút Save trên toolbar, phím tắt Ctrl+S và menu File ▸ Save. Mỗi nơi tự gọi logic lưu.","UI bị dính với nghiệp vụ, code trùng lặp, và không có cách nào hoàn tác (undo)."],n:[{i:"i1",l:"Nút 💾 Save",x:150,y:90},{i:"i2",l:"Ctrl + S",x:150,y:220},{i:"i3",l:"Menu ▸ Save",x:150,y:350},{i:"rc",l:"Editor.save()",s:"logic trùng lặp",x:610,y:220,k:"warn",w:170}],e:[{f:"i1",t:"rc",flow:1,k:"warn"},{f:"i2",t:"rc",flow:1,k:"warn"},{f:"i3",t:"rc",flow:1,k:"warn"}],code:`saveButton.onclick = () => { validate(); editor.save(); log(); };
hotkey("ctrl+s", ()  => { validate(); editor.save(); log(); });
menu.save.onclick = () => { validate(); editor.save(); log(); };`},{t:"Yêu cầu thành đối tượng",p:["Ta đóng gói hành động vào <code>SaveCommand</code> có phương thức <code>execute()</code>.","<b>Invoker</b> (nút, phím tắt) chỉ biết gọi <code>execute()</code>; <b>Receiver</b> (Editor) mới là nơi làm việc thật."],n:[{i:"i1",l:"Nút 💾 Save",x:120,y:90},{i:"i2",l:"Ctrl + S",x:120,y:220},{i:"i3",l:"Menu ▸ Save",x:120,y:350},{i:"cm",l:"SaveCommand",s:"execute()",x:400,y:220,k:"accent",w:170},{i:"rc",l:"Editor",s:"receiver",x:660,y:220,k:"blue"}],e:[{f:"i1",t:"cm",flow:1,seq:0},{f:"i2",t:"cm",flow:1,seq:0},{f:"i3",t:"cm",flow:1,seq:0},{f:"cm",t:"rc",l:"save()",flow:1,seq:1,k:"accent"}],code:`interface Command { execute(): void; undo?(): void; }

class SaveCommand implements Command {
  constructor(private editor: Editor) {}
  execute() { this.editor.save(); }
}

const save = new SaveCommand(editor);
saveButton.onclick = () => save.execute();
hotkey("ctrl+s", () => save.execute());`},{t:"Lịch sử & Undo",p:["Mỗi command đã chạy được đẩy vào <code>History</code>. Command lưu đủ thông tin để tự đảo ngược.","Bấm Ctrl+Z: lấy command cuối khỏi stack và gọi <code>undo()</code>. Đây là nền tảng của undo/redo, job queue và transaction log."],n:[{i:"i2",l:"Ctrl + Z",x:120,y:350},{i:"i1",l:"Gõ chữ",x:120,y:90},{i:"cm",l:"TypeCommand",s:"execute() / undo()",x:400,y:90,k:"accent",w:180},{i:"rc",l:"Editor",s:"receiver",x:670,y:220,k:"blue"},{i:"hs",l:"History",s:"[cmd, cmd, cmd]",x:400,y:350,k:"green",w:180}],e:[{f:"i1",t:"cm",l:"execute()",flow:1,seq:0},{f:"cm",t:"rc",flow:1,seq:1,k:"accent"},{f:"cm",t:"hs",l:"push",flow:1,seq:1,k:"green"},{f:"i2",t:"hs",l:"pop()",flow:1,seq:2,k:"gold"},{f:"hs",t:"rc",l:"undo()",flow:1,seq:3,k:"green"}],code:`class TypeCommand implements Command {
  private backup = "";
  constructor(private ed: Editor, private text: string) {}
  execute() { this.backup = this.ed.text; this.ed.insert(this.text); }
  undo()    { this.ed.text = this.backup; }
}

const history: Command[] = [];
function run(c: Command) { c.execute(); history.push(c); }
function undo() { history.pop()?.undo?.(); }`}]},{id:"state",g:"Behavioral",t:"State",tag:"Cho phép đối tượng thay đổi hành vi khi trạng thái nội bộ thay đổi, như thể nó đổi sang một class khác.",when:["Hành vi phụ thuộc nhiều vào trạng thái","switch(state) lặp lại ở nhiều phương thức"],avoid:["Chỉ có 2–3 trạng thái và hiếm khi thay đổi"],steps:[{t:"Vấn đề: switch khắp nơi",p:["Một bài viết có các trạng thái Draft, Moderation, Published. Phương thức <code>publish()</code> phải <code>switch</code> theo trạng thái, và <code>render()</code>, <code>edit()</code> cũng vậy.","Thêm trạng thái “Archived” nghĩa là phải sửa mọi câu <code>switch</code>."],n:[{i:"doc",l:"Document",s:"publish()",x:170,y:220,k:"blue"},{i:"sw",l:"switch (state)",x:410,y:220,k:"warn",w:160},{i:"d",l:"case 'draft'",x:660,y:100,k:"muted"},{i:"m",l:"case 'moderation'",x:660,y:220,k:"muted",w:170},{i:"p",l:"case 'published'",x:660,y:340,k:"muted",w:170}],e:[{f:"doc",t:"sw",flow:1,seq:0},{f:"sw",t:"d",flow:1,seq:1,k:"warn"},{f:"sw",t:"m",flow:1,seq:1,k:"warn"},{f:"sw",t:"p",flow:1,seq:1,k:"warn"}],code:`publish() {
  switch (this.state) {
    case "draft":      this.state = "moderation"; break;
    case "moderation": if (isAdmin) this.state = "published"; break;
    case "published":  /* không làm gì */ break;
  }
}`},{t:"Máy trạng thái",p:["Vẽ ra sơ đồ: mỗi trạng thái quyết định chuyển sang trạng thái nào khi nhận một hành động.","Ý tưởng của pattern là: <b>mỗi nút trên sơ đồ trở thành một class</b>."],n:[{i:"d",l:"Draft",x:150,y:250,k:"blue",w:140},{i:"m",l:"Moderation",x:400,y:100,k:"gold",w:150},{i:"p",l:"Published",x:650,y:250,k:"green",w:150}],e:[{f:"d",t:"m",l:"publish()",flow:1,seq:0,k:"blue"},{f:"m",t:"p",l:"approve()",flow:1,seq:1,k:"green"},{f:"m",t:"d",l:"reject()",flow:1,seq:2,b:-90,dash:1,k:"warn"},{f:"p",t:"d",l:"expire()",flow:1,seq:3,b:-60,dash:1,k:"gold"}],code:`// Draft      --publish()-->  Moderation
// Moderation --approve()-->  Published
// Moderation --reject()-->   Draft
// Published  --expire()-->   Draft`},{t:"Ủy quyền cho đối tượng State",p:["<code>Document</code> giữ một tham chiếu <code>state</code> và chuyển mọi lời gọi cho nó: <code>this.state.publish()</code>.","Mỗi lớp trạng thái tự quyết định hành vi và tự chuyển document sang trạng thái kế tiếp. Không còn <code>switch</code> nào."],n:[{i:"doc",l:"Document",s:"state: State",x:140,y:220,k:"accent"},{i:"if",l:"«State»",s:"publish() · render()",x:410,y:220,k:"blue",w:180},{i:"d",l:"DraftState",x:680,y:90,w:150},{i:"m",l:"ModerationState",x:680,y:220,w:170},{i:"p",l:"PublishedState",x:680,y:350,w:160}],e:[{f:"doc",t:"if",l:"state.publish()",flow:1,k:"accent"},{f:"d",t:"if",dash:1},{f:"m",t:"if",dash:1},{f:"p",t:"if",dash:1}],code:`interface State { publish(doc: Document): void; }

class DraftState implements State {
  publish(doc) { doc.setState(new ModerationState()); }
}
class ModerationState implements State {
  publish(doc) {
    if (doc.user.isAdmin) doc.setState(new PublishedState());
  }
}

class Document {
  state: State = new DraftState();
  setState(s: State) { this.state = s; }
  publish() { this.state.publish(this); }
}`}]},{id:"abstract-factory",g:"Creational",t:"Abstract Factory",tag:"Tạo ra các họ đối tượng liên quan với nhau mà không cần chỉ rõ class cụ thể của chúng.",when:["Cần nhiều sản phẩm đi theo bộ, phải đồng bộ với nhau","Hỗ trợ nhiều nền tảng / theme"],avoid:["Chỉ có một họ sản phẩm, hiếm khi thêm sản phẩm mới"],steps:[{t:"Vấn đề: trộn lẫn sai bộ",p:["App cần Button, Checkbox, Dialog… theo phong cách Material trên Android và Cupertino trên iOS.","Nếu mỗi màn hình tự <code>new</code> từng widget, rất dễ xảy ra cảnh nút Material đứng cạnh checkbox Cupertino."],n:[{i:"app",l:"Màn hình Login",x:150,y:220,w:170},{i:"mb",l:"MaterialButton",x:580,y:120,k:"green",w:170},{i:"cc",l:"CupertinoCheckbox",s:"✕ lệch bộ",x:580,y:320,k:"warn",w:190}],e:[{f:"app",t:"mb",l:"new",flow:1},{f:"app",t:"cc",l:"new",flow:1,k:"warn"}],code:`const btn = new MaterialButton();

auth.setNext(log).setNext(cache).setNext(network);`},{t:"Dừng giữa chừng",p:["Handler nào cũng có quyền <b>cắt ngang chuỗi</b>. Ví dụ CacheInterceptor có sẵn dữ liệu thì trả về luôn, không gọi mạng nữa.","Trên mobile còn gặp pattern này ở responder chain của iOS, ở cách sự kiện chạm được chuyển qua các ViewGroup trên Android, và ở middleware."],n:[{i:"rq",l:"Request",x:100,y:110,w:120},{i:"h1",l:"AuthInterceptor",x:340,y:110,k:"blue",w:165},{i:"h2",l:"LogInterceptor",x:600,y:110,k:"blue",w:160},{i:"h3",l:"CacheInterceptor",s:"cache hit ✓",x:600,y:300,k:"green",w:170},{i:"net",l:"🌐 Network",s:"không cần gọi",x:280,y:330,k:"muted",w:150}],e:[{f:"rq",t:"h1",flow:1,seq:0},{f:"h1",t:"h2",flow:1,seq:1,k:"blue"},{f:"h2",t:"h3",flow:1,seq:2,k:"blue"},{f:"h3",t:"rq",l:"Response (cache)",flow:1,seq:3,b:40,k:"green"},{f:"h3",t:"net",dash:1}],code:`// OkHttp (Kotlin)
